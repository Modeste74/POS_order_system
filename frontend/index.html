<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>POS App</title>
    <link rel="stylesheet" type="text/css" href="./index.css">
    <style>
        #response.success { color: green; }
        #response.error { color: red; }
        #checkoutBtn:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>
    <header>
        <h1>Simple POS App</h1>
        <button id="logoutBtn">Logout</button>
    </header>
    
    <main class="container">
        <!-- Products Column -->
        <section class="product-column">
            <div class="section">
                <h2>Product</h2>
                <div id="products" class="product-list"></div>
            </div>
        </section>

        <!-- Cart Column -->
        <aside class="cart-column">
            <div class="section">
                <h2>Cart</h2>
                <div id="cart" class="cart-list"></div>
                <div id="cart-total"><strong>Total: $0.00</strong></div>
                <button id="checkoutBtn" disabled>Checkout</button>
            </div>
        </aside>
    </main>

    <section class="responses">
        <h2>Responses</h2>
        <pre id="response"></pre>
    </section>

    <section class="order-history">
        <h2>Order History</h2>
        <div id="orders"></div>
    </section>

    <script>
        const API_BASE = "http://127.0.0.1:5000";
        let cart = [];
        let token = localStorage.getItem("token");

        // If not logged in, redirect to Login
        if (!token) {
            window.location.href = "login.html";
        }
        
        // Fetch products from backend
        async function loadProducts() {
            const res = await fetch(`${API_BASE}/products/`);
            const products = await res.json();
            const container = document.getElementById("products");
            container.innerHTML = "";
            products.forEach(p => {
                const div = document.createElement("div");
                div.className = "product";
                div.innerHTML = `
                    <strong>${p.name}</strong><br>
                    Price: $${p.price}<br>
                    Stock: ${p.stock}<br>
                    <button onclick="addToCart(${p.id}, '${p.name}', ${p.price})">Add to Cart</button>
                `;
                container.appendChild(div);
            });
        }

        function addToCart(id, name, price) {
            const existing = cart.find(item => item.id === id)
            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({ id, name, price, quantity: 1 });
            }
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById("cart");
            container.innerHTML = "";

            let total = 0;

            cart.forEach((item, idx) => {
                total += item.price * item.quantity;
                const div = document.createElement("div");
                div.className = "cart-item";
                div.innerHTML = `
                    ${item.name} - $${item.price} x ${item.quantity} 
                    = $${(item.price * item.quantity).toFixed(2)}
                    <button onclick="decreaseQty(${idx})">-</button>
                    <button onclick="increaseQty(${idx})">+</button>
                    <button onclick="removeFromCart(${idx})">Remove</button>
                `;
                container.appendChild(div);
            });

            document.getElementById("cart-total").innerHTML = `<strong>Total: $${total.toFixed(2)}</strong>`;
            document.getElementById("checkoutBtn").disabled = cart.length === 0;
        }

        function increaseQty(idx) {
            cart[idx].quantity += 1;
            renderCart();
        }

        function decreaseQty(idx) {
            if (cart[idx].quantity > 1) {
                cart[idx].quantity -= 1;
            } else {
                cart.splice(idx, 1);
            }
            renderCart();
        }

        function removeFromCart(idx) {
            cart.splice(idx, 1);
            renderCart();
        }

        // Checkout: create order then pay
        async function checkout() {
            if (cart.length === 0) {
                alert("Cart is empty!");
                return;
            }

            try {
                // Step 1: Create order
                const orderRes = await fetch(`${API_BASE}/orders/`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token
                    },
                    body: JSON.stringify({
                        items: cart.map(c => ({ id: c.id, qty: c.quantity }))
                    })
                });
                const order = await orderRes.json();

                // Step 2: Checkout (Stripe PaymentIntent or mock)
                const checkoutRes = await fetch(`${API_BASE}/checkout/create-payment-intent`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token
                    },
                    body: JSON.stringify({ order_id: order.id })
                });
                const payment = await checkoutRes.json();

                const respEl = document.getElementById("response");
                respEl.textContent = `✅ Order ${order.id} created successfully!\nPayment secret: ${payment.client_secret}`;
                respEl.className = "success";

                cart = [];
                renderCart();
                loadOrders();
            } catch (err) {
                console.error(err);
                const respEl = document.getElementById("response");
                respEl.textContent = "❌ Error: " + err.message;
                respEl.className = "error";
            }
        }

        async function loadOrders() {
            try {
                const res = await fetch(`${API_BASE}/orders/get_orders`, {
                    headers: { "Authorization": "Bearer " + token }
                });
                const orders = await res.json();
                const container = document.getElementById("orders");
                container.innerHTML = "";

                orders.forEach(o => {
                    const div = document.createElement("div");
                    div.className = "order";
                    div.innerHTML = `
                        <strong>Order #${o.id}</strong> - Total: $${o.total} - Status: ${o.status}
                    `;
                    container.appendChild(div);
                });
            } catch (err) {
                console.error("Failed to load orders:", err);
            }
        }

        document.getElementById("checkoutBtn").addEventListener("click", checkout);

        // Load products + orders when page loads
        loadProducts();
        loadOrders();

        document.getElementById("logoutBtn").addEventListener("click", () => {
            localStorage.removeItem("token");
            window.location.href = "login.html";
        });
    </script>
</body>
</html>
